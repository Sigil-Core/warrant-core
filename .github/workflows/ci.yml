name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '22'
          - '24'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Pack the public artifact
        run: npm pack --json > npm-pack.json
      - name: Inspect the public artifact
        run: |
          package_tgz="$(node --input-type=module -e "const pack = JSON.parse(await (await import('node:fs/promises')).readFile('npm-pack.json', 'utf8')); process.stdout.write(pack[0].filename)")"
          tar -tzf "$package_tgz" | sort | tee package-files.txt
          diff -u <(printf '%s\n' \
            package/LICENSE \
            package/README.md \
            package/dist/canonical.d.ts \
            package/dist/canonical.d.ts.map \
            package/dist/canonical.js \
            package/dist/canonical.js.map \
            package/dist/capabilities.d.ts \
            package/dist/capabilities.d.ts.map \
            package/dist/capabilities.js \
            package/dist/capabilities.js.map \
            package/dist/commitment.d.ts \
            package/dist/commitment.d.ts.map \
            package/dist/commitment.js \
            package/dist/commitment.js.map \
            package/dist/crypto/browser.d.ts \
            package/dist/crypto/browser.d.ts.map \
            package/dist/crypto/browser.js \
            package/dist/crypto/browser.js.map \
            package/dist/crypto/node.d.ts \
            package/dist/crypto/node.d.ts.map \
            package/dist/crypto/node.js \
            package/dist/crypto/node.js.map \
            package/dist/crypto/webcrypto.d.ts \
            package/dist/crypto/webcrypto.d.ts.map \
            package/dist/crypto/webcrypto.js \
            package/dist/crypto/webcrypto.js.map \
            package/dist/crypto/workers.d.ts \
            package/dist/crypto/workers.d.ts.map \
            package/dist/crypto/workers.js \
            package/dist/crypto/workers.js.map \
            package/dist/html-comments.d.ts \
            package/dist/html-comments.d.ts.map \
            package/dist/html-comments.js \
            package/dist/html-comments.js.map \
            package/dist/index.d.ts \
            package/dist/index.d.ts.map \
            package/dist/index.js \
            package/dist/index.js.map \
            package/dist/policy.d.ts \
            package/dist/policy.d.ts.map \
            package/dist/policy.js \
            package/dist/policy.js.map \
            package/dist/response-policy.d.ts \
            package/dist/response-policy.d.ts.map \
            package/dist/response-policy.js \
            package/dist/response-policy.js.map \
            package/dist/serializer.d.ts \
            package/dist/serializer.d.ts.map \
            package/dist/serializer.js \
            package/dist/serializer.js.map \
            package/dist/signature.d.ts \
            package/dist/signature.d.ts.map \
            package/dist/signature.js \
            package/dist/signature.js.map \
            package/dist/types.d.ts \
            package/dist/types.d.ts.map \
            package/dist/types.js \
            package/dist/types.js.map \
            package/dist/validation.d.ts \
            package/dist/validation.d.ts.map \
            package/dist/validation.js \
            package/dist/validation.js.map \
            package/package.json) \
            <(tar -tzf "$package_tgz" | sort)

  browser-vectors:
    name: Browser vectors on Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  workers-vectors:
    name: Workers vectors on workerd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:workers
